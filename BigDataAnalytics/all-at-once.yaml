# Docker Compose for All-At-Once Code Clone Detection

version: "3.8"
services:
  clone-detector:
    image: cljdetector
    command: clear 
    ports:
      - 8080:3000
    volumes:
      - ./Containers/cljdetector:/usr/src/app
      - qc-volume:/QualitasCorpus
    environment:
      DBHOST: dbstorage
      SOURCEDIRtest: "/usr/src/app/test/data"
      SOURCEDIReclipse: "/QualitasCorpus/QualitasCorpus-20130901r/Systems/eclipse_SDK"
      SOURCEDIR: "/QualitasCorpus"
      CHUNKSIZE: 20

  dbstorage:
    image: mongo:7.0
    restart: always
    command: --quiet --syslog
    ports:
      - 27017:27017
    expose:
      - "27017"
    volumes:
      - dbstorage:/data/db
      - dbconfig:/data/configdb

  # A2 MonitorTool: samples the database while cljDetector runs, page on http://localhost:8081
  monitor:
    image: monitortool
    depends_on:
      - dbstorage
    ports:
      - 8081:3000
    volumes:
      - ./Containers/MonitorTool/data:/app/data
    environment:
      DBHOST: dbstorage
      SAMPLE_SECONDS: 10

volumes:
  dbstorage:
  dbconfig:
  qc-volume:
    external: true
    
